# Operator-owned Linux runtime closure. Copy to runtime-profile.yaml and adapt exact paths.
# Do not bind /, /usr, /bin, /lib, /etc, /home, /opt, or other broad system directories.
# File symlinks are canonicalized to one file; directory mounts must be selected package roots.
version: 1

mounts:
  - source: /usr/local/bin/node
    target: /usr/local/bin/node
  - source: /usr/bin/bash
    target: /bin/bash
  - source: /usr/bin/sh
    target: /bin/sh
  - source: /usr/bin/env
    target: /usr/bin/env
  - source: /usr/bin/git
    target: /usr/bin/git
  - source: /lib/ld-linux-aarch64.so.1
    target: /lib/ld-linux-aarch64.so.1
  - source: /lib/aarch64-linux-gnu/libatomic.so.1
    target: /lib/aarch64-linux-gnu/libatomic.so.1
  - source: /lib/aarch64-linux-gnu/libdl.so.2
    target: /lib/aarch64-linux-gnu/libdl.so.2
  - source: /lib/aarch64-linux-gnu/libm.so.6
    target: /lib/aarch64-linux-gnu/libm.so.6
  - source: /lib/aarch64-linux-gnu/libstdc++.so.6
    target: /lib/aarch64-linux-gnu/libstdc++.so.6
  - source: /lib/aarch64-linux-gnu/libgcc_s.so.1
    target: /lib/aarch64-linux-gnu/libgcc_s.so.1
  - source: /lib/aarch64-linux-gnu/libpthread.so.0
    target: /lib/aarch64-linux-gnu/libpthread.so.0
  - source: /lib/aarch64-linux-gnu/libc.so.6
    target: /lib/aarch64-linux-gnu/libc.so.6
  - source: /lib/aarch64-linux-gnu/libtinfo.so.6
    target: /lib/aarch64-linux-gnu/libtinfo.so.6
  - source: /lib/aarch64-linux-gnu/libpcre2-8.so.0
    target: /lib/aarch64-linux-gnu/libpcre2-8.so.0
  - source: /lib/aarch64-linux-gnu/libz.so.1
    target: /lib/aarch64-linux-gnu/libz.so.1
  - source: /etc/ssl/certs/ca-certificates.crt
    target: /etc/ssl/certs/ca-certificates.crt
  - source: /etc/resolv.conf
    target: /etc/resolv.conf
  - source: /etc/nsswitch.conf
    target: /etc/nsswitch.conf

commands:
  /bin/bash: /bin/bash
  /bin/sh: /bin/sh
  node: /usr/local/bin/node
  git: /usr/bin/git
# Add one exact executable-file mount per selected CLI and its selected package roots.
# Example command mapping after adding its executable file:
#   agy: /opt/factory-cli/agy.js
