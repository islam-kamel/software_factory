# ============================================================
# nginx.conf
# Purpose : Restrict provider egress and inject proxy-only credentials
# Feature : Phase 3 network hardening
# Role    : API gateway configuration
# API Doc : https://nginx.org/en/docs/http/ngx_http_proxy_module.html
# ============================================================
pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr warn;

events {
    worker_connections 128;
}

http {
    access_log off;
    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 32m;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    proxy_connect_timeout 10s;
    proxy_read_timeout 10m;
    proxy_send_timeout 10m;
    proxy_buffering off;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/cert.pem;
    proxy_ssl_verify_depth 4;

    limit_req_zone $server_name zone=openrouter_rate:10m rate=60r/m;
    limit_req_zone $server_name zone=openai_rate:10m rate=60r/m;
    limit_req_zone $server_name zone=opencode_rate:10m rate=60r/m;
    limit_req_zone $server_name zone=ollama_rate:10m rate=120r/m;
    limit_req_status 429;

    map $server_name $openrouter_auth {
        default "Bearer ${OPENROUTER_API_KEY}";
    }
    map $server_name $openai_auth {
        default "Bearer ${OPENAI_API_KEY}";
    }
    map $server_name $opencode_auth {
        default "Bearer ${OPENCODE_API_KEY}";
    }
    map $server_name $openrouter_origin {
        default https://openrouter.ai;
    }
    map $server_name $openai_origin {
        default https://api.openai.com;
    }
    map $server_name $opencode_origin {
        default https://opencode.ai;
    }
    map $server_name $ollama_origin {
        default http://ollama:11434;
    }

    server {
        listen unix:/run/factory/public.sock;
        server_name _;

        location = /healthz {
            access_log off;
            return 204;
        }

        location = /openrouter/api/v1/chat/completions {
            if ($request_method != POST) { return 405; }
            if ($args != "") { return 400; }
            if ($openrouter_auth = "Bearer ") { return 503; }
            limit_req zone=openrouter_rate burst=20 nodelay;
            rewrite ^/openrouter/api/v1/chat/completions$ /api/v1/chat/completions break;
            proxy_pass $openrouter_origin;
            proxy_set_header Host openrouter.ai;
            proxy_set_header Authorization $openrouter_auth;
            proxy_ssl_name openrouter.ai;
            include /tmp/nginx/proxy-llm-headers.conf;
        }

        location = /openai/v1/chat/completions {
            if ($request_method != POST) { return 405; }
            if ($args != "") { return 400; }
            if ($openai_auth = "Bearer ") { return 503; }
            limit_req zone=openai_rate burst=20 nodelay;
            rewrite ^/openai/v1/chat/completions$ /v1/chat/completions break;
            proxy_pass $openai_origin;
            proxy_set_header Host api.openai.com;
            proxy_set_header Authorization $openai_auth;
            proxy_ssl_name api.openai.com;
            include /tmp/nginx/proxy-llm-headers.conf;
        }

        location = /opencode-go/inference/go/chat/completions {
            if ($request_method != POST) { return 405; }
            if ($args != "") { return 400; }
            if ($opencode_auth = "Bearer ") { return 503; }
            limit_req zone=opencode_rate burst=20 nodelay;
            rewrite ^/opencode-go/inference/go/chat/completions$ /inference/go/chat/completions break;
            proxy_pass $opencode_origin;
            proxy_set_header Host opencode.ai;
            proxy_set_header Authorization $opencode_auth;
            proxy_ssl_name opencode.ai;
            include /tmp/nginx/proxy-llm-headers.conf;
        }

        location = /ollama-local/v1/chat/completions {
            if ($request_method != POST) { return 405; }
            if ($args != "") { return 400; }
            limit_req zone=ollama_rate burst=40 nodelay;
            rewrite ^/ollama-local/v1/chat/completions$ /v1/chat/completions break;
            proxy_pass $ollama_origin;
            proxy_set_header Host ollama;
            proxy_set_header Authorization "";
            include /tmp/nginx/proxy-llm-headers.conf;
        }

        location / {
            return 404;
        }
    }

    server {
        listen unix:/run/factory/local.sock;
        server_name _;

        location = /healthz {
            access_log off;
            return 204;
        }

        location = /ollama-local/v1/chat/completions {
            if ($request_method != POST) { return 405; }
            if ($args != "") { return 400; }
            limit_req zone=ollama_rate burst=40 nodelay;
            rewrite ^/ollama-local/v1/chat/completions$ /v1/chat/completions break;
            proxy_pass $ollama_origin;
            proxy_set_header Host ollama;
            proxy_set_header Authorization "";
            include /tmp/nginx/proxy-llm-headers.conf;
        }

        location / {
            return 403;
        }
    }
}
